name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group benchmark

      - name: Run benchmarks
        shell: bash
        run: |
          uv run pytest benchmarks/ \
            --benchmark-json=benchmark-results.json \
            --benchmark-min-rounds=5 \
            --benchmark-warmup=on \
            --benchmark-disable-gc \
            -v

      - name: Clean working directory
        run: git checkout -- .

      # Store baseline on push to main (all OSes)
      - name: Store baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "nonoha-core Benchmark (${{ matrix.os }})"
          tool: 'pytest'
          output-file-path: benchmark-results.json
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: "dev/bench/${{ matrix.os }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false

      # Compare against baseline on PRs from this repository (can comment/fail)
      - name: Compare benchmark
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "nonoha-core Benchmark (${{ matrix.os }})"
          tool: 'pytest'
          output-file-path: benchmark-results.json
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: "dev/bench/${{ matrix.os }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '150%'
          fail-threshold: '200%'
          summary-always: true
          comment-on-alert: true
          fail-on-alert: true

      # Fork PRs run with a read-only token: keep the comparison visible in
      # the job summary but disable everything that writes to the repository.
      - name: Compare benchmark (fork)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "nonoha-core Benchmark (${{ matrix.os }})"
          tool: 'pytest'
          output-file-path: benchmark-results.json
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: "dev/bench/${{ matrix.os }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          alert-threshold: '150%'
          summary-always: true
          comment-on-alert: false
          fail-on-alert: false
